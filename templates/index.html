<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chatbot for Customer Service</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #0f0f1a, #1c1c2b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 400px;
      background: #22223b;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid #444;
    }
    .chat-header img {
      width: 40px;
      border-radius: 50%;
      background: white;
      padding: 5px;
    }
    .messages {
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    .message {
      max-width: 70%;
      padding: 12px;
      border-radius: 10px;
      margin: 5px 0;
      opacity: 0;
      animation: fadeIn 0.5s forwards;
    }
    .user { background: #007bff; align-self: flex-end; color: white; }
    .bot { background: #4caf50; align-self: flex-start; color: white; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .input-container {
      display: flex;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid #444;
    }
    input {
      flex: 1;
      padding: 10px;
      background: #333;
      border: none;
      color: white;
      border-radius: 5px;
      font-size: 16px;
    }
    button {
      margin-left: 10px;
      padding: 10px 15px;
      background: #007bff;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #0056b3; }
    .voice-button {
      margin-left: 10px;
      background: #ff4757;
    }
    .voice-button:hover { background: #c82333; }
    .history-button {
      margin-left: 10px;
      background: #f39c12;
    }
    .history-button:hover { background: #d68910; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h3>AI Chatbot for Customer Service</h3>
      <img src="https://cdn-icons-png.flaticon.com/512/4712/4712037.png" alt="Bot Icon">
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-container">
      <input type="text" id="userInput" placeholder="Type a message...">
      <button onclick="sendMessage()">Send</button>
      <button class="voice-button" onclick="startVoiceRecognition()">🎤</button>
      <button class="history-button" onclick="showChatHistory()">📜</button>
    </div>
  </div>

  <script>
    const apiUrl = "http://127.0.0.1:5000/chat";

    async function sendMessage() {
      const inputField = document.getElementById('userInput');
      const userMessage = inputField.value;
      if (!userMessage) return;
      addMessage("You: " + userMessage, "user");
      inputField.value = "";
      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: userMessage })
        });
        const data = await response.json();
        addMessage("Bot: " + data.response, "bot");
      } catch (error) {
        addMessage("Bot: Sorry, something went wrong.", "bot");
        console.error(error);
      }
    }

    function addMessage(message, sender) {
      const messagesDiv = document.getElementById('messages');
      const messageElement = document.createElement('div');
      messageElement.className = "message " + sender;
      messageElement.textContent = message;
      messagesDiv.appendChild(messageElement);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function startVoiceRecognition() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.start();
      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('userInput').value = transcript;
      };
    }

    function showChatHistory() {
      alert("Chat history feature coming soon!");
    }
  </script>
</body>
</html>
