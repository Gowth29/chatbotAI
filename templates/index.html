<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body {
            background: linear-gradient(to right, #1e3c72, #2a5298); /* Gradient background */
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .chat-container {
            max-width: 400px;
            margin: auto;
            background: #2c3e50; /* Dark blue background */
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #555;
            padding: 10px;
            background: #34495e; /* Dark gray-blue chat area */
            border-radius: 5px;
        }
        .user-message {
            text-align: right;
            background: #2980b9;
            color: white;
            padding: 8px;
            margin: 5px;
            border-radius: 10px;
            display: inline-block;
            max-width: 70%;
        }
        .bot-message {
            text-align: left;
            background: #95a5a6;
            color: black;
            padding: 8px;
            margin: 5px;
            border-radius: 10px;
            display: inline-block;
            max-width: 70%;
        }
        input {
            width: 75%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background: #ecf0f1;
            color: black;
        }
        button {
            padding: 10px 15px;
            margin-top: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <h2>AI Chatbot</h2>
    <div class="chat-container">
        <div class="chat-box" id="chat-box"></div>
        <input type="text" id="user-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            let userInput = document.getElementById("user-input").value;
            if (!userInput.trim()) return;

            let chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="user-message">${userInput}</div>`;
            document.getElementById("user-input").value = "";

            let response = await fetch("http://127.0.0.1:8000/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: userInput })
            });

            let data = await response.json();
            chatBox.innerHTML += `<div class="bot-message">${data.reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
